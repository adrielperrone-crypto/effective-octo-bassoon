
name: ADR RDP Gaming

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Configure Core RDP Settings
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force

          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1 -Force

          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 2 -Force

          netsh advfirewall firewall delete rule name="RDP-Tailscale"

          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389 remoteip=100.64.0.0/10

          Restart-Service -Name TermService -Force

      - name: Create RDP User ADR
        shell: pwsh
        run: |
          $upper = "ABCDEFGHJKLMNPQRSTUVWXYZ".ToCharArray()
          $lower = "abcdefghijkmnpqrstuvwxyz".ToCharArray()
          $nums = "23456789".ToCharArray()

          $parts = @()
          $parts += $upper | Get-Random -Count 5
          $parts += $lower | Get-Random -Count 7
          $parts += $nums | Get-Random -Count 6

          $password = -join ($parts | Sort-Object { Get-Random })

          $securePass = ConvertTo-SecureString $password -AsPlainText -Force

          New-LocalUser -Name "ADR" -Password $securePass -AccountNeverExpires -PasswordNeverExpires

          Add-LocalGroupMember -Group "Administrators" -Member "ADR"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "ADR"

          echo "RDP_PASS=$password" >> $env:GITHUB_ENV

      - name: Update Windows Package Sources
        shell: pwsh
        run: |
          winget source update

      - name: Install Roblox Player
        shell: pwsh
        run: |
          Write-Host "Installing Roblox Player..."

          winget install --id Roblox.Roblox `
            --exact `
            --silent `
            --accept-package-agreements `
            --accept-source-agreements `
            --disable-interactivity

          if ($LASTEXITCODE -ne 0) {
            Write-Warning "Roblox installation failed or was unavailable."
          }

      - name: Install Gaming Applications
        shell: pwsh
        run: |
          $apps = @(
            "7zip.7zip",
            "Google.Chrome",
            "Valve.Steam",
            "EpicGames.EpicGamesLauncher"
          )

          foreach ($app in $apps) {
            Write-Host "Installing $app"

            winget install --id $app `
              --exact `
              --silent `
              --accept-package-agreements `
              --accept-source-agreements `
              --disable-interactivity

            if ($LASTEXITCODE -ne 0) {
              Write-Warning "Could not install $app"
            }
          }

      - name: Prepare Gaming Environment
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path C:\Games -Force
          New-Item -ItemType Directory -Path C:\Downloads -Force

          Write-Host "Checking graphics hardware..."

          Get-CimInstance Win32_VideoController |
            Select-Object Name, DriverVersion, AdapterRAM |
            Format-Table -AutoSize

          Write-Host "Gaming folders ready"

      - name: Install Latest Tailscale
        shell: pwsh
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath

          Start-Process msiexec.exe `
            -ArgumentList "/i `"$installerPath`" /quiet /norestart" `
            -Wait

          Remove-Item $installerPath -Force

      - name: Establish Tailscale Connection
        shell: pwsh
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up `
            --authkey="$env:TS_AUTHKEY" `
            --hostname="adr-rdp-$env:GITHUB_RUN_ID"

          $tsIP = $null

          for ($i = 0; $i -lt 20; $i++) {
            $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4 2>$null |
              Select-Object -First 1

            if ($tsIP) { break }

            Start-Sleep -Seconds 5
          }

          if (-not $tsIP) {
            throw "Tailscale IP not assigned"
          }

          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: Verify RDP Accessibility
        shell: pwsh
        run: |
          Write-Host "Testing RDP..."

          $result = Test-NetConnection `
            -ComputerName $env:TAILSCALE_IP `
            -Port 3389

          if ($result.TcpTestSucceeded) {
            Write-Host "RDP connection successful"
          } else {
            Write-Warning "RDP connection test failed"
          }

      - name: Display RDP Information
        shell: pwsh
        run: |
          Write-Host "=========================="
          Write-Host "ADR RDP GAMING"
          Write-Host "IP: $env:TAILSCALE_IP"
          Write-Host "USER: ADR"
          Write-Host "PASSWORD: $env:RDP_PASS"
          Write-Host "=========================="

      - name: Maintain Connection
        shell: pwsh
        run: |
          while ($true) {
            Write-Host "ADR RDP Active: $(Get-Date)"
            Start-Sleep -Seconds 300
          }
          
